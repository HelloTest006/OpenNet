name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Cross-compilation only. These are not executed here; the test job above is
  # what actually runs the code. Building each target is what catches a change
  # that compiles on one OS and breaks on another.
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,   goarm: "7" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          # Android is a linux target with a specific ABI; a phone build is
          # linux/arm64 with the appropriate NDK at link time, which matters
          # only once a driver needs cgo. Pure Go cross-compiles today.
          - { goos: android, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/opennetd

  # The binaries a person downloads from the releases page. The same set the
  # build job compiles, so a target that passes CI is a target someone can
  # actually run. Android is a raw executable rather than an .apk: a phone app
  # needs an SDK and a manifest this repo does not have, and the binary runs
  # under Termux as-is.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, goarm: "",  suffix: "" }
          - { goos: linux,   goarch: arm64, goarm: "",  suffix: "" }
          - { goos: linux,   goarch: arm,   goarm: "7", suffix: "" }
          - { goos: windows, goarch: amd64, goarm: "",  suffix: ".exe" }
          - { goos: windows, goarch: arm64, goarm: "",  suffix: ".exe" }
          - { goos: darwin,  goarch: amd64, goarm: "",  suffix: "" }
          - { goos: darwin,  goarch: arm64, goarm: "",  suffix: "" }
          - { goos: freebsd, goarch: amd64, goarm: "",  suffix: "" }
          - { goos: android, goarch: arm64, goarm: "",  suffix: "" }
          - { goos: android, goarch: arm,   goarm: "7", suffix: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          name="opennetd-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "$GOARM" ]; then name="$name-v$GOARM"; fi
          go build -ldflags "-s -w" -o "dist/${name}${{ matrix.suffix }}" ./cmd/opennetd
      - uses: actions/upload-artifact@v4
        with:
          name: opennetd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: dist/*
          if-no-files-found: error

  # One job attaches every binary, because the release action run from each
  # matrix leg races on creating the release and drops assets.
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
